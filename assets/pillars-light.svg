<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="01 Challenger le besoin : découper en la plus petite unité qui valide l'hypothèse. 02 Livrer sans dette : hexagonal + TDD assisté par l'IA. 03 Itérer : chaque retour utilisateur devient une évolution.">
  <rect width="1200" height="260" fill="#fbfaf7"/>
  <rect x="64" y="24" width="336" height="212" rx="10" fill="#f2ede3"/>
  <rect x="64" y="24" width="336" height="4" fill="#b4531f"/>
  <text x="88" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#b4531f">01</text>
  <text x="88" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1d22">Challenger le besoin</text>
  <text x="88" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3b3f48"><tspan x="88" dy="0">Questionner la valeur, puis</tspan><tspan x="88" dy="26">découper en la plus petite unité</tspan><tspan x="88" dy="26">qui valide l'hypothèse du besoin.</tspan></text>
  <rect x="432" y="24" width="336" height="212" rx="10" fill="#f2ede3"/>
  <rect x="432" y="24" width="336" height="4" fill="#24508f"/>
  <text x="456" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#24508f">02</text>
  <text x="456" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1d22">Livrer sans dette</text>
  <text x="456" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3b3f48"><tspan x="456" dy="0">Architecture hexagonale + TDD,</tspan><tspan x="456" dy="26">assistée par l'IA (Claude Code) :</tspan><tspan x="456" dy="26">un code prêt à pivoter.</tspan></text>
  <rect x="800" y="24" width="336" height="212" rx="10" fill="#f2ede3"/>
  <rect x="800" y="24" width="336" height="4" fill="#1b1d22"/>
  <text x="824" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#1b1d22">03</text>
  <text x="824" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#1b1d22">Itérer</text>
  <text x="824" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3b3f48"><tspan x="824" dy="0">Chaque retour utilisateur devient</tspan><tspan x="824" dy="26">une évolution, vite et en</tspan><tspan x="824" dy="26">confiance grâce aux tests.</tspan></text>
  
</svg>
